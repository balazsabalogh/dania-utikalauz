const PHOTO_QUERY={

'Skt. Peders Bageri':'Sankt Peders Bageri Copenhagen bakery',
'Inderhavnsbroen':'Inderhavnsbroen Copenhagen bridge',
'Broens Street Food':'Broens Street Food Copenhagen',
'Amalienborg':'Amalienborg Copenhagen palace',
'Kis hableány':'Little Mermaid Copenhagen',
'Søerne – The Lakes':'Sortedams Lake Copenhagen',
'Søernes Ølbar':'Søernes Ølbar Copenhagen',
'Tivoli Gardens':'Tivoli Gardens Copenhagen',

'ARoS':'ARoS Aarhus Art Museum rainbow panorama',

'Salling Rooftop':'Salling Rooftop Aarhus',

const photoCache=JSON.parse(localStorage.getItem('daniaPhotoCacheV1')||'{}');
const cats=[['itinerary','🗓️','Útiterv'],['sights','🏰','Látnivalók'],['map','🗺️','Térkép'],['food','🍴','Éttermek'],['pubs','🍺','Kocsmák'],['cafes','☕','Kávézók'],['wc','🚻','WC'],['shops','🛍️','Boltok'],['tips','💡','Tippek'],['favs','❤️','Kedvencek']];
let city='copenhagen',day=0,view='sights',map,markerLayer,routeLine,userMarker,accuracyCircle,routeBounds,routeRequest=0;
const $=id=>document.getElementById(id);const current=()=>C[city];const activeDay=()=>current().days[day];const maps=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
function renderShell(){renderCities();renderHero();renderDays();renderCategories();renderSidebar();renderBottom();renderContent()}
function renderCities(){const html=Object.entries(C).map(([k,c])=>`<button class="city-icon-btn ${k===city?'active':''}" data-city="${k}"><div class="city-icon">${c.emoji}</div><span>${c.name}</span></button>`).join('');$('cityGrid').innerHTML=html;document.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{city=b.dataset.city;day=0;view='sights';closeDrawer();renderShell()})}
function renderHero(){const c=current();$('heroTitle').textContent=c.name+' 🇩🇰';$('heroText').textContent=c.intro;$('heroChips').innerHTML=c.tags.map(x=>`<span class="chip">${x}</span>`).join('');$('heroImage').style.backgroundImage=`url('${IMG[city]||IMG.copenhagen}')`}
function renderDays(){$('daybar').innerHTML=current().days.map((d,i)=>`<button class="day-btn ${i===day?'active':''}" data-day="${i}">${city==='copenhagen'?['Szerda 29.','Csütörtök 30.','Péntek 31. ✈️'][i]:`${i+1}. nap`} · ${d.title.split('–').pop().trim()}</button>`).join('');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=+b.dataset.day;renderDays();renderContent();if(map)drawMap()})}
function renderCategories(){$('categorybar').innerHTML=cats.slice(0,8).map(c=>`<button class="cat-btn ${view===c[0]?'active':''}" data-cat="${c[0]}">${c[1]} ${c[2]}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{view=b.dataset.cat;renderCategories();renderSidebar();renderBottom();renderContent()})}
function renderSidebar(){$('sideCities').innerHTML=Object.entries(C).map(([k,c])=>`<button class="side-btn side-city ${k===city?'active':''}" data-city="${k}"><span class="ico">${c.emoji}</span>${c.name}</button>`).join('');$('sideCats').innerHTML=cats.slice(1).map(c=>`<button class="side-btn ${view===c[0]?'active':''}" data-cat="${c[0]}"><span class="ico">${c[1]}</span>${c[2]}</button>`).join('');document.querySelectorAll('#sidebar [data-city]').forEach(b=>b.onclick=()=>{city=b.dataset.city;day=0;view='sights';closeDrawer();renderShell()});document.querySelectorAll('#sidebar [data-cat]').forEach(b=>b.onclick=()=>{view=b.dataset.cat;closeDrawer();renderShell()})}
function renderBottom(){$('mobileBottom').innerHTML=[cats[0],cats[2],cats[9],cats[8],['settings','⚙️','Beállítások']].map(c=>`<button class="bottom-btn ${view===c[0]?'active':''}" data-bottom="${c[0]}"><span>${c[1]}</span>${c[2]}</button>`).join('');document.querySelectorAll('[data-bottom]').forEach(b=>b.onclick=()=>{view=b.dataset.bottom==='settings'?'tips':b.dataset.bottom;renderShell()})}
function card(p){const favs=JSON.parse(localStorage.getItem('daniaFavs')||'[]'),fav=favs.includes(p.name),auto=!p.img&&p.cat==='sights'&&PHOTO_QUERY[p.name],img=p.img?`style="background-image:url('${p.img}')"`:'';return `<article class="panel place-card"><div class="card-image ${p.img?'loaded':auto?'auto-photo':'fallback'}" ${img} ${auto?`data-photo="${p.name}"`:''}>${p.img?'':auto?'':p.icon}${p.img?'<span class="photo-credit"></span>':''}</div><div class="card-body"><div class="card-top"><h3 class="card-title">📍 ${p.name}</h3>${p.rating?`<span class="rating">${p.rating}</span>`:''}</div><p class="card-desc">${p.desc}</p><div class="worth"><b>👍 Megéri elmenni!</b><span>${p.worth}</span></div><div class="meta"><span>◷ ${p.time}</span><span>🏷 ${p.price}</span><span>Ⓜ ${p.transport}</span></div>${p.story?`<button class="story-toggle">Bővebben ▾</button><div class="story"><div class="story-inner"><div class="story-text">${p.story}</div></div></div>`:''}<div class="actions"><a class="action blue" target="_blank" rel="noopener" href="${maps(p.query||p.name+' '+current().name)}">📍 Térkép</a><button class="fav ${fav?'on':''}" data-fav="${p.name}">${fav?'♥':'♡'}</button></div></div></article>`}
async function loadPlacePhotos(){const els=[...document.querySelectorAll('[data-photo]')];await Promise.all(els.map(async el=>{const name=el.dataset.photo,query=PHOTO_QUERY[name];try{let item=photoCache[name];if(!item){const url='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrlimit=8&gsrsearch='+encodeURIComponent(query)+'&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=900&format=json&origin=*';const r=await fetch(url);if(!r.ok)throw Error('photo');const d=await r.json(),pages=Object.values(d.query?.pages||{}).filter(x=>x.imageinfo?.[0]?.thumburl);if(!pages.length)throw Error('none');pages.sort((a,b)=>{const score=x=>{const t=(x.title||'').toLowerCase();let n=0;for(const word of query.toLowerCase().split(/\s+/))if(word.length>3&&t.includes(word))n++;if(/logo|map|plan|sign|icon|coat|flag/.test(t))n-=5;return n};return score(b)-score(a)});const info=pages[0].imageinfo[0],meta=info.extmetadata||{};item={url:info.thumburl,credit:(meta.Artist?.value||'Wikimedia Commons').replace(/<[^>]*>/g,'').slice(0,90)};photoCache[name]=item;localStorage.setItem('daniaPhotoCacheV1',JSON.stringify(photoCache))}el.style.backgroundImage=`url('${item.url}')`;el.classList.add('loaded');const cr=document.createElement('span');cr.className='photo-credit';cr.textContent='Fotó: '+item.credit;el.appendChild(cr)}catch(e){el.classList.add('failed');el.textContent=(current().places.find(p=>p.name===name)?.icon)||'📍'}}))}
function renderContent(){const area=$('contentArea'),q=$('search').value.toLowerCase();if(view==='itinerary'){section('🗓️ '+activeDay().title);area.innerHTML=`<div class="panel route-summary"><b>${activeDay().route}</b><br><small>${activeDay().stops.length} megálló · a Térkép fülön utcai útvonal és GPS</small></div><div class="timeline">${activeDay().stops.map((s,i)=>`<article class="panel stop-card"><div class="stop-time">${s[0]}</div><div class="stop-main"><h3>${i+1}. ${s[1]}</h3><p>${s[2]}</p><div class="meta"><span>◷ ${s[3]}</span><span>🏷 ${s[4]}</span></div><div class="actions"><a class="action" target="_blank" href="${maps(s[7])}">Navigáció</a><button class="action red" onclick="openStop(${i})">Térképen</button></div></div></article>`).join('')}</div>`}
else if(view==='map'){section('🗺️ Interaktív napi térkép');area.innerHTML=`<div class="panel map-status" id="routeStatus">Útvonal előkészítése…</div><div class="map-wrap"><div id="map"></div><div class="map-tools"><button class="map-tool" id="locateBtn">◎</button><button class="map-tool" id="fitBtn">⌖</button></div></div>`;setTimeout(initMap,50)}
else if(view==='tips'){section('💡 Hasznos infók');area.innerHTML=`<div class="cards"><article class="panel card-body"><h3>Offline használat</h3><p class="card-desc">A felület és a mentett tartalom internet nélkül is megnyílik. Az OpenStreetMap térképcsempék, a GPS-hez tartozó utcai útvonal és a külső navigáció internetet igényelhet.</p></article><article class="panel card-body"><h3>GPS-helyzet</h3><p class="card-desc">A Térkép fül megnyitása után nyomd meg az ◎ gombot. A helyzetet csak egyszer kéri le, nem követ folyamatosan.</p></article></div>`}
else{let list=current().places;if(view==='favs'){const f=JSON.parse(localStorage.getItem('daniaFavs')||'[]');list=list.filter(p=>f.includes(p.name));section('❤️ Kedvencek')}else{list=list.filter(p=>p.cat===view);section((cats.find(c=>c[0]===view)||['','📍','Helyek']).slice(1).join(' '))}list=list.filter(p=>(p.name+' '+p.desc+' '+p.worth).toLowerCase().includes(q));area.innerHTML=`<div class="cards">${list.length?list.map(card).join(''):'<div class="panel empty">Nincs találat ebben a kategóriában.</div>'}</div>`;bindCards();loadPlacePhotos()}}
function section(t){$('sectionTitle').textContent=t;$('search').style.display=['map','itinerary','tips'].includes(view)?'none':'block'}
function bindCards(){document.querySelectorAll('.story-toggle').forEach(b=>b.onclick=()=>{b.nextElementSibling.classList.toggle('open')});document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{let f=JSON.parse(localStorage.getItem('daniaFavs')||'[]'),n=b.dataset.fav;f=f.includes(n)?f.filter(x=>x!==n):[...f,n];localStorage.setItem('daniaFavs',JSON.stringify(f));renderContent()})}
function openStop(i){view='map';renderShell();setTimeout(()=>{const s=activeDay().stops[i];if(map&&s[5])map.flyTo([s[5],s[6]],16)},600)}
function initMap(){if(map){map.remove();map=null}map=L.map('map',{zoomControl:false}).setView(current().center,current().zoom);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);markerLayer=L.layerGroup().addTo(map);$('locateBtn').onclick=locateMe;$('fitBtn').onclick=()=>routeBounds&&map.fitBounds(routeBounds,{padding:[35,35]});drawMap()}
function numberedIcon(n){return L.divIcon({className:'',html:`<div class="numbered-marker">${n}</div>`,iconSize:[34,34],iconAnchor:[17,17]})}function userIcon(){return L.divIcon({className:'',html:'<div class="user-marker"></div>',iconSize:[18,18],iconAnchor:[9,9]})}
function decodePolyline6(str){let index=0,lat=0,lon=0,out=[];while(index<str.length){let b,shift=0,result=0;do{b=str.charCodeAt(index++)-63;result|=(b&31)<<shift;shift+=5}while(b>=32);lat+=(result&1)?~(result>>1):(result>>1);shift=0;result=0;do{b=str.charCodeAt(index++)-63;result|=(b&31)<<shift;shift+=5}while(b>=32);lon+=(result&1)?~(result>>1):(result>>1);out.push([lat/1e6,lon/1e6])}return out}
async function drawMap(){if(!map)return;const req=++routeRequest,pts=[];markerLayer.clearLayers();if(routeLine)map.removeLayer(routeLine);activeDay().stops.forEach((s,i)=>{if(!s[5])return;const marker=[s[5],s[6]],route=(Number.isFinite(s[8])&&Number.isFinite(s[9]))?[s[8],s[9]]:marker,enabled=s[10]!==false;if(enabled)pts.push(route);L.marker(marker,{icon:numberedIcon(i+1)}).addTo(markerLayer).bindPopup(`<b>${i+1}. ${s[1]}</b><br>${s[2]}<br><br><a target="_blank" href="${maps(s[7])}">Navigáció</a>`)});routeBounds=L.latLngBounds(pts);if(pts.length)map.fitBounds(routeBounds,{padding:[40,40]});$('routeStatus').textContent='Gyalogos útvonal számítása…';if(pts.length<2)return;try{const payload={locations:pts.map(p=>({lat:p[0],lon:p[1]})),costing:'pedestrian',units:'kilometers',language:'hu-HU'};const res=await fetch('https://valhalla1.openstreetmap.de/route?json='+encodeURIComponent(JSON.stringify(payload)));if(!res.ok)throw Error();const data=await res.json();if(req!==routeRequest)return;const coords=[];(data.trip?.legs||[]).forEach(leg=>{const part=decodePolyline6(leg.shape);if(coords.length&&part.length)part.shift();coords.push(...part)});routeLine=L.polyline(coords,{color:'#ef3b45',weight:6,opacity:.96,lineJoin:'round'}).addTo(map);routeBounds=routeLine.getBounds();map.fitBounds(routeBounds,{padding:[35,35]});$('routeStatus').innerHTML=`<b>Utcákon vezetett gyalogos útvonal</b> · ${Number(data.trip.summary?.length||0).toFixed(1)} km · kb. ${Math.round((data.trip.summary?.time||0)/60)} perc séta`}catch(e){routeLine=L.polyline(pts,{color:'#ef3b45',weight:5,dashArray:'9 9'}).addTo(map);$('routeStatus').innerHTML='<b>Az útvonaltervező most nem érhető el.</b> Szaggatott összekötés látszik.'}}
function locateMe(){navigator.geolocation?.getCurrentPosition(pos=>{const p=[pos.coords.latitude,pos.coords.longitude],acc=Math.round(pos.coords.accuracy);if(userMarker)map.removeLayer(userMarker);if(accuracyCircle)map.removeLayer(accuracyCircle);userMarker=L.marker(p,{icon:userIcon(),zIndexOffset:1000}).addTo(map);accuracyCircle=L.circle(p,{radius:acc,color:'#198cff',weight:1,fillOpacity:.1}).addTo(map);map.flyTo(p,16);$('routeStatus').innerHTML=`<b>Itt vagytok most.</b> A GPS pontossága kb. ${acc} méter.`},()=>{$('routeStatus').textContent='A helyzet most nem kérhető le. Engedélyezd a helymeghatározást a Safari beállításaiban.'},{enableHighAccuracy:true,timeout:12000,maximumAge:30000})}
function openDrawer(){$('sidebar').classList.add('open');$('shade').classList.add('open')}function closeDrawer(){$('sidebar').classList.remove('open');$('shade').classList.remove('open')}
$('menuBtn').onclick=openDrawer;$('shade').onclick=closeDrawer;$('search').oninput=renderContent;$('searchBtn').onclick=()=>{$('search').scrollIntoView({behavior:'smooth'});$('search').focus()};$('favBtn').onclick=()=>{view='favs';renderShell()};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));renderShell();
</script>
